<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳远动作技术分析系统 | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PoseNet + tfjs 2.8.4 -->
    <script src="https://unpkg.com/@tensorflow/tfjs@2.8.4/dist/tf.min.js"></script>
    <script src="https://unpkg.com/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .video-container video,
        .video-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .btn-primary {
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-loading { background: #fef3c7; color: #92400e; }
        .status-success { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .angle-display {
            font-family: 'Courier New', monospace;
            background: #1e293b;
            color: #4ade80;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .report-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .highlight-row {
            background: #fef3c7;
            font-weight: bold;
        }
        .diagnosis-block{
            background-color:#dbeafe;
            border-left:4px solid #2563eb;
            padding:12px;
            border-radius:8px;
            margin-bottom:16px;
            font-family:system-ui;
            font-size:14px;
            line-height:1.6;
        }
        .diagnosis-title{
            font-weight:bold;
            font-size:16px;
            color:#1e40af;
            margin-bottom:8px;
        }
        .problem-text{
            color:#b91c1c;
            font-weight:500;
        }
        .suggest-text{
            color:#047857;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8 text-center lg:text-left">
        <div class="flex items-center justify-center lg:justify-start gap-3 mb-2">
            <span class="text-4xl">🏃</span>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-emerald-600 bg-clip-text text-transparent">
                跳远动作技术分析系统
            </h1>
            <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">PRO</span>
        </div>
        <p class="text-slate-600">AI逐帧追踪 · 起跳点定位 · 关节角度计算 + 自动跳远技术诊断</p>
    </header>

    <div class="grid lg:grid-cols-5 gap-6">
        <div class="lg:col-span-3 bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-slate-800">📹 视频输入与姿态可视化</h2>
                <span id="statusBadge" class="status-badge status-loading">
                    <span class="w-2 h-2 bg-yellow-500 rounded-full"></span>
                    等待加载模型
                </span>
            </div>

            <div class="mb-6 p-4 border-2 border-dashed border-slate-300 rounded-xl hover:border-blue-400 transition-colors bg-slate-50">
                <label class="flex flex-col items-center cursor-pointer">
                    <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <span class="text-sm text-slate-600 font-medium">点击上传跳远视频（MP4格式）</span>
                    <span class="text-xs text-slate-400 mt-1">支持拖拽上传，建议分辨率720p</span>
                    <input type="file" id="videoFile" accept="video/mp4" class="hidden">
                </label>
            </div>

            <div class="video-container mb-4">
                <video id="srcVideo" controls class="w-full h-full"></video>
                <canvas id="poseCanvas" class="pointer-events-none"></canvas>
            </div>

            <div class="flex flex-wrap gap-3 mb-4">
                <button id="btnLoadModel" class="btn-primary bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    加载 AI 模型
                </button>
                <button id="btnAnalyzeAll" disabled class="btn-primary bg-emerald-600 text-white px-6 py-2.5 rounded-lg font-medium flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    开始智能分析
                </button>
            </div>

            <div class="bg-slate-800 rounded-lg p-4">
                <div class="text-slate-400 text-xs mb-1">当前帧关节角度（实时）</div>
                <div id="angleText" class="angle-display">等待分析...</div>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl p-6 border border-slate-200 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-slate-800">📊 全程动作诊断报告</h2>
                <span class="text-xs px-2 py-1 bg-emerald-100 text-emerald-700 rounded-full font-medium">智能采样</span>
            </div>
            
            <div id="report" class="report-box flex-1">
                <div class="text-slate-400 text-center mt-20">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-6m0 0V5a2 2 0 012-2h6a2 2 0 012 2v6m0 0v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2h6a2 2 0 012 2z"></path>
                    </svg>
                    <p>上传视频并点击分析后，此处将显示：</p>
                    <ul class="text-sm mt-2 text-left inline-block">
                        <li>• 逐帧关节角度数据</li>
                        <li>• 起跳点定位 + 跳远专项技术诊断</li>
                        <li>• 技术缺陷判定与改进方案</li>
                    </ul>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mt-4">
                <div class="bg-blue-50 rounded-lg p-3 text-center">
                    <div class="text-2xl font-bold text-blue-600" id="statFrames">-</div>
                    <div class="text-xs text-blue-600 mt-1">分析帧数</div>
                </div>
                <div class="bg-emerald-50 rounded-lg p-3 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="statTime">-</div>
                    <div class="text-xs text-emerald-600 mt-1">耗时(秒)</div>
                </div>
                <div class="bg-purple-50 rounded-lg p-3 text-center">
                    <div class="text-2xl font-bold text-purple-600" id="statJump">-</div>
                    <div class="text-xs text-purple-600 mt-1">起跳时刻</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let net = null;
const video = document.getElementById('srcVideo');
const canvas = document.getElementById('poseCanvas');
const ctx = canvas.getContext('2d');
const btnLoadModel = document.getElementById('btnLoadModel');
const btnAnalyzeAll = document.getElementById('btnAnalyzeAll');
const statusBadge = document.getElementById('statusBadge');
const reportEl = document.getElementById('report');
const angleTextEl = document.getElementById('angleText');
const fileInput = document.getElementById('videoFile');

// ========== 新增：关键点滑动滤波，解决骨架抖动、不贴合人体 ==========
const filterBuffer = [];
const FILTER_WINDOW = 3; // 取最近3帧做移动平均，平滑轨迹
function smoothKeypoints(newKpRaw) {
    filterBuffer.push(newKpRaw);
    if(filterBuffer.length > FILTER_WINDOW) filterBuffer.shift();
    const smoothed = [];
    for(let i=0;i<17;i++){
        let sumX=0,sumY=0,sumScore=0,count=0;
        filterBuffer.forEach(frame=>{
            const k = frame[i];
            if(k.score>0.4){
                sumX += k.position.x;
                sumY += k.position.y;
                sumScore += k.score;
                count++;
            }
        })
        if(count ===0){
            smoothed.push({x:newKpRaw[i].position.x, y:newKpRaw[i].position.y, score:newKpRaw[i].score})
        }else{
            smoothed.push({
                x: sumX/count,
                y: sumY/count,
                score: sumScore/count
            })
        }
    }
    return smoothed;
}

// 角度计算函数
function calcAngle(pA, vertex, pB) {
    const v1x = pA.x - vertex.x, v1y = pA.y - vertex.y;
    const v2x = pB.x - vertex.x, v2y = pB.y - vertex.y;
    const dot = v1x*v2x + v1y*v2y;
    const mag1 = Math.sqrt(v1x*v1x + v1y*v1y);
    const mag2 = Math.sqrt(v2x*v2x + v2y*v2y);
    if(mag1===0 || mag2===0) return null;
    let rad = Math.acos(Math.max(-1, Math.min(1, dot/(mag1*mag2))));
    return rad * 180 / Math.PI;
}

// 状态更新
function updateStatus(text, type = 'loading') {
    const colors = {
        loading: 'bg-yellow-500',
        success: 'bg-emerald-500',
        error: 'bg-red-500'
    };
    statusBadge.className = `status-badge status-${type}`;
    statusBadge.innerHTML = `<span class="w-2 h-2 ${colors[type]} rounded-full"></span>${text}`;
}

const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

btnLoadModel.onclick = async () => {
    try {
        updateStatus('正在加载PoseNet模型...', 'loading');
        btnLoadModel.disabled = true;
        // 降低分辨率，减少计算，缓解延迟
        net = await posenet.load({
            architecture: 'MobileNetV1',
            outputStride:16,
            inputResolution:{width:512, height:384},
            quantBytes:2
        });
        updateStatus('模型就绪', 'success');
        btnAnalyzeAll.disabled = false;
        btnLoadModel.innerHTML = '✓ 模型已加载';
        btnLoadModel.classList.replace('bg-blue-600', 'bg-slate-400');
    } catch(e) {
        updateStatus('加载失败: ' + e.message, 'error');
        btnLoadModel.disabled = false;
        console.error(e);
    }
};

fileInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        offCanvas.width = video.videoWidth;
        offCanvas.height = video.videoHeight;
        filterBuffer.length = 0; // 切换视频清空滤波缓存
        updateStatus('视频已就绪', 'success');
    };
};

function seekTo(time) {
    return new Promise(resolve => {
        video.onseeked = resolve;
        video.currentTime = time;
    });
}

async function analyzeFrame(t, showPose = true) {
    await seekTo(t);
    offCtx.drawImage(video, 0, 0, offCanvas.width, offCanvas.height);
    const pose = await net.estimateSinglePose(offCanvas);
    // 时序平滑
    const kp = smoothKeypoints(pose.keypoints);
    const th = 0.4;
    const angles = { time: t };
    if(kp[11].score>th && kp[13].score>th && kp[15].score>th)
        angles.leftKnee = calcAngle(kp[11], kp[13], kp[15]);
    if(kp[12].score>th && kp[14].score>th && kp[16].score>th)
        angles.rightKnee = calcAngle(kp[6], kp[12], kp[14]);
    if(kp[5].score>th && kp[11].score>th && kp[13].score>th)
        angles.leftHip = calcAngle(kp[5], kp[11], kp[13]);
    if(kp[6].score>th && kp[12].score>th && kp[14].score>th)
        angles.rightHip = calcAngle(kp[6], kp[12], kp[14]);
    
    if(showPose) drawPose(kp);
    return angles;
}

// ========== 跳远专项自动诊断函数 ==========
function getJumpDiagnosis(jumpDataList, jumpCenterTime){
    // 提取起跳窗口内所有膝关节角度
    const window = jumpDataList.filter(d=>Math.abs(d.time-jumpCenterTime)<0.5);
    let minKneeAngle = 180;
    let maxHipAngle = 0;
    window.forEach(d=>{
        if(d.rightKnee && d.rightKnee < minKneeAngle) minKneeAngle = d.rightKnee;
        if(d.rightHip && d.rightHip > maxHipAngle) maxHipAngle = d.rightHip;
    })
    const diagnosis = {
        minKnee: minKneeAngle,
        maxHip: maxHipAngle,
        problems:[],
        suggestions:[]
    };
    // 判定规则，对标优秀运动员标准
    if(minKneeAngle < 130){
        diagnosis.problems.push("❌ 起跳缓冲屈膝过大（膝角"+minKneeAngle.toFixed(1)+"°，优秀运动员135~145°），过度屈膝会大量损耗水平助跑速度，蹬伸发力效率下降，损失远度。");
        diagnosis.suggestions.push("✅ 改进：起跳着板时主动保持腿部刚性，减少膝关节下沉幅度；练习原地快速起跳（小幅度缓冲），强化支撑腿刚性。");
    }else if(minKneeAngle >150){
        diagnosis.problems.push("⚠️ 起跳缓冲不足，膝关节弯曲太少，没有充分利用肌肉弹性储能，蹬伸爆发力不足。");
        diagnosis.suggestions.push("✅ 改进：助跑最后一步适度下压缓冲，做箱式跳、连续单脚跳，练习可控的屈膝缓冲。");
    }else{
        diagnosis.problems.push("✅ 膝关节缓冲角度处于优秀区间，缓冲控制良好。");
    }

    if(maxHipAngle <160){
        diagnosis.problems.push("❌ 起跳蹬伸阶段伸髋不充分，髋关节打开不足，重心向前上方推送不够，腾起高度不足。");
        diagnosis.suggestions.push("✅ 改进：强化臀大肌与髋伸力量；练习臀推、跨步跳，体会起跳瞬间髋关节向前顶送的发力感。");
    }else{
        diagnosis.problems.push("✅ 蹬伸阶段髋关节伸展充分。");
    }
    return diagnosis;
}

btnAnalyzeAll.onclick = async () => {
    if(!net || !video.src) return alert("请先加载模型并上传视频");
    filterBuffer.length=0;
    updateStatus('分析中...', 'loading');
    btnAnalyzeAll.disabled = true;
    reportEl.innerHTML = '<div class="flex items-center justify-center h-full"><div class="spinner"></div><span class="ml-2">正在分析...</span></div>';
    
    const duration = video.duration;
    const startTime = performance.now();
    
    const coarseFrames = [];
    for(let t=0; t<=duration; t+=0.2) {
        const data = await analyzeFrame(t, false);
        coarseFrames.push(data);
        if(coarseFrames.length % 10 === 0) {
            updateStatus(`粗采样 ${t.toFixed(1)}s/${duration.toFixed(1)}s`, 'loading');
        }
    }
    
    // 识别起跳时刻：膝关节角度快速下降再回升
    let maxChange = 0, jumpCenter = duration/2;
    for(let i=1; i<coarseFrames.length; i++) {
        const prev = coarseFrames[i-1].rightKnee ?? 180;
        const curr = coarseFrames[i].rightKnee ?? 180;
        const delta = Math.abs(curr-prev);
        if(delta > maxChange) {
            maxChange = delta;
            jumpCenter = coarseFrames[i].time;
        }
    }
    
    // 精细采样起跳窗口
    const fineFrames = [];
    const fineStart = Math.max(0, jumpCenter - 0.5);
    const fineEnd = Math.min(duration, jumpCenter + 0.5);
    for(let t=fineStart; t<=fineEnd; t+=0.033) {
        const data = await analyzeFrame(t, true);
        fineFrames.push(data);
        angleTextEl.innerText = `L膝:${data.leftKnee?.toFixed(1)??'-'}° R膝:${data.rightKnee?.toFixed(1)??'-'}°`;
    }
    
    const allFrames = [...coarseFrames];
    fineFrames.forEach(f => {
        if(!allFrames.some(c => Math.abs(c.time - f.time) < 0.01)) allFrames.push(f);
    });
    allFrames.sort((a,b) => a.time - b.time);
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
    
    // 调用跳远诊断
    const diag = getJumpDiagnosis(allFrames, jumpCenter);

    document.getElementById('statFrames').textContent = allFrames.length;
    document.getElementById('statTime').textContent = elapsed;
    document.getElementById('statJump').textContent = jumpCenter.toFixed(2) + 's';
    
    // ========== 生成报告：最上方增加诊断模块 ==========
    let html = `<div class="diagnosis-block">
        <div class="diagnosis-title">📋 跳远起跳专项技术诊断</div>
        <div><strong>起跳窗口最小膝角：</strong>${diag.minKnee.toFixed(1)}°</div>
        <div><strong>蹬伸最大髋角：</strong>${diag.maxHip.toFixed(1)}°</div>
        <br/>
        <div class="problem-text">【问题判定】</div>`;
    diag.problems.forEach(p=> html += `<div>• ${p}</div>`);
    html += `<br/><div class="suggest-text">【改进训练方案】</div>`;
    diag.suggestions.forEach(s=> html += `<div>• ${s}</div>`);
    html += `</div>`;

    html += `<div class="mb-4 p-3 bg-blue-50 rounded-lg text-sm">
        <strong>分析完成：</strong>${allFrames.length}帧 | 耗时${elapsed}s | 起跳候选: ${jumpCenter.toFixed(2)}s
    </div>`;
    
    html += `<table class="w-full text-xs"><thead><tr class="bg-slate-200">
        <th class="p-2">时间</th><th class="p-2">左膝</th><th class="p-2">右膝</th><th class="p-2">左髋</th><th class="p-2">右髋</th>
    </tr></thead><tbody>`;
    
    allFrames.forEach(d => {
        const isJump = Math.abs(d.time - jumpCenter) < 0.1;
        html += `<tr class="${isJump ? 'highlight-row' : 'hover:bg-slate-50'}">
            <td class="p-2 border-b">${d.time.toFixed(2)}s${isJump ? ' 🔥' : ''}</td>
            <td class="p-2 border-b">${d.leftKnee?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.rightKnee?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.leftHip?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.rightHip?.toFixed(1)??'-'}</td>
        </tr>`;
    });
    html += '</tbody></table>';
    
    reportEl.innerHTML = html;
    updateStatus('分析完成', 'success');
    btnAnalyzeAll.disabled = false;
};

function drawPose(keypoints){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    keypoints.forEach(kp=>{
        if(kp.score > 0.4){
            ctx.beginPath();
            ctx.arc(kp.x, kp.y, 5, 0, 2*Math.PI);
            ctx.fillStyle = "#ff2222";
            ctx.fill();
        }
    });
    const edges = [[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
    ctx.strokeStyle = "#00ff44";
    ctx.lineWidth = 3;
    edges.forEach(([a,b])=>{
        if(keypoints[a].score>0.4 && keypoints[b].score>0.4){
            ctx.beginPath();
            ctx.moveTo(keypoints[a].x, keypoints[a].y);
            ctx.lineTo(keypoints[b].x, keypoints[b].y);
            ctx.stroke();
        }
    });
}
</script>
</body>
</html>
