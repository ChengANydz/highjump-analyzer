<script>
let net = null;
const video = document.getElementById('srcVideo');
const canvas = document.getElementById('poseCanvas');
const ctx = canvas.getContext('2d');
const btnLoadModel = document.getElementById('btnLoadModel');
const btnAnalyzeAll = document.getElementById('btnAnalyzeAll');
const statusBadge = document.getElementById('statusBadge');
const reportEl = document.getElementById('report');
const angleTextEl = document.getElementById('angleText');
const fileInput = document.getElementById('videoFile');
const jumpTypeSelect = document.getElementById('jumpTypeSelect');
const sampleStepSelect = document.getElementById('sampleStepSelect');

// 关键点滑动时序滤波，解决骨架抖动
const filterBuffer = [];
const FILTER_WINDOW = 3;
function smoothKeypoints(newKpRaw) {
    filterBuffer.push(newKpRaw);
    if(filterBuffer.length > FILTER_WINDOW) filterBuffer.shift();
    const smoothed = [];
    for(let i=0;i<17;i++){
        let sumX=0,sumY=0,sumScore=0,count=0;
        filterBuffer.forEach(frame=>{
            const k = frame[i];
            if(k.score>0.4){
                sumX += k.x;
                sumY += k.y;
                sumScore += k.score;
                count++;
            }
        })
        if(count ===0){
            smoothed.push({x:newKpRaw[i].x, y:newKpRaw[i].y, score:newKpRaw[i].score})
        }else{
            smoothed.push({
                x: sumX/count,
                y: sumY/count,
                score: sumScore/count
            })
        }
    }
    return smoothed;
}

// 三点夹角计算
function calcAngle(pA, vertex, pB) {
    const v1x = pA.x - vertex.x, v1y = pA.y - vertex.y;
    const v2x = pB.x - vertex.x, v2y = pB.y - vertex.y;
    const dot = v1x*v2x + v1y*v2y;
    const mag1 = Math.sqrt(v1x*v1x + v1y*v1y);
    const mag2 = Math.sqrt(v2x*v2x + v2y*v2y);
    if(mag1===0 || mag2===0) return null;
    let rad = Math.acos(Math.max(-1, Math.min(1, dot/(mag1*mag2))));
    return rad * 180 / Math.PI;
}

function updateStatus(text, type = 'loading') {
    const colors = {
        loading: 'bg-yellow-500',
        success: 'bg-emerald-500',
        error: 'bg-red-500'
    };
    statusBadge.className = `status-badge status-${type}`;
    statusBadge.innerHTML = `<span class="w-2 h-2 ${colors[type]} rounded-full"></span>${text}`;
}

const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

btnLoadModel.onclick = async () => {
    try {
        updateStatus('正在初始化TF后端...', 'loading');
        btnLoadModel.disabled = true;

        // =========【关键修复1：强制使用webgl后端，禁用webgpu优先】=========
        await tf.setBackend('webgl');
        await tf.ready(); // 等待后端完全就绪！解决WebGPU未初始化报错
        console.log("当前TF后端：", tf.getBackend());

        updateStatus('正在加载MoveNet Thunder模型...', 'loading');
        // =========【关键修复2：修正常量名称SINGLEPOSE_THUNDER】==========
        net = await poseDetection.createDetector(
            poseDetection.SupportedModels.MoveNet,
            {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER
            }
        );
        updateStatus('模型就绪', 'success');
        btnAnalyzeAll.disabled = false;
        btnLoadModel.innerHTML = '✓ 模型已加载';
        btnLoadModel.classList.replace('bg-blue-600', 'bg-slate-400');
    } catch(e) {
        updateStatus('加载失败: ' + e.message, 'error');
        btnLoadModel.disabled = false;
        console.error(e);
    }
};

fileInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        offCanvas.width = video.videoWidth;
        offCanvas.height = video.videoHeight;
        filterBuffer.length = 0;
        updateStatus('视频已就绪', 'success');
    };
};

function seekTo(time) {
    return new Promise(resolve => {
        video.onseeked = resolve;
        video.currentTime = time;
    });
}

async function analyzeFrame(t, showPose = true) {
    await seekTo(t);
    offCtx.drawImage(video, 0, 0, offCanvas.width, offCanvas.height);
    const poses = await net.estimatePoses(offCanvas);
    if (!poses.length) return null;
    const kp = smoothKeypoints(poses[0].keypoints);
    const th = 0.4;
    const angles = { time: t };
    // 左膝：髋(11)-膝(13)-踝(15)
    if(kp[11].score>th && kp[13].score>th && kp[15].score>th)
        angles.leftKnee = calcAngle(kp[11], kp[13], kp[15]);
    // 右膝：髋(12)-膝(14)-踝(16)
    if(kp[12].score>th && kp[14].score>th && kp[16].score>th)
        angles.rightKnee = calcAngle(kp[12], kp[14], kp[16]);
    //左髋：肩(5)-髋(11)-膝(13)
    if(kp[5].score>th && kp[11].score>th && kp[13].score>th)
        angles.leftHip = calcAngle(kp[5], kp[11], kp[13]);
    //右髋：肩(6)-髋(12)-膝(14)
    if(kp[6].score>th && kp[12].score>th && kp[14].score>th)
        angles.rightHip = calcAngle(kp[6], kp[12], kp[14]);

    // 躯干角：左肩5 - 髋11 与竖直方向夹角
    if(kp[5].score>th && kp[11].score>th){
        angles.torsoAngle = calcAngle({x:kp[5].x, y:kp[5].y-100}, kp[11], kp[5]);
    }
    // 摆动腿髋角（用于跨越式）
    if(kp[5].score>th && kp[11].score>th && kp[13].score>th){
        angles.swingHipAngle = calcAngle(kp[5], kp[11], kp[13]);
    }
    
    if(showPose) drawPose(kp);
    return angles;
}

// ====================== 两套专项诊断函数 ======================
// 背越式跳高诊断
function diagnosisBackStyle(jumpDataList, jumpCenterTime){
    const window = jumpDataList.filter(d=>Math.abs(d.time-jumpCenterTime)<0.5);
    let minKneeAngle = null;
    let maxHipAngle = 0;
    let maxTorsoAngle = 0;
    window.forEach(d=>{
        if(d.rightKnee){
            if(minKneeAngle === null || d.rightKnee < minKneeAngle) minKneeAngle = d.rightKnee;
        }
        if(d.rightHip && d.rightHip > maxHipAngle) maxHipAngle = d.rightHip;
        if(d.torsoAngle && d.torsoAngle > maxTorsoAngle) maxTorsoAngle = d.torsoAngle;
    })
    const diagnosis = {
        minKnee: minKneeAngle,
        maxHip: maxHipAngle,
        maxTorso: maxTorsoAngle,
        problems:[],
        suggestions:[]
    };
    if(minKneeAngle === null){
        diagnosis.problems.push("⚠️ 未能有效识别踏跳腿膝关节数据，请检查视频：侧面拍摄，全身完整入镜，肢体不要裁切。");
        diagnosis.suggestions.push("✅ 拍摄建议：侧面视角，完整捕捉弧线助跑最后一步、踏跳离地、腾空过杆全过程。");
    }else if(minKneeAngle < 150){
        diagnosis.problems.push(`❌ 踏跳阶段屈膝过大（膝角${minKneeAngle.toFixed(1)}°）。背越式踏跳核心是刚性支撑，屈膝过多会吸收垂直冲击力，大幅损失向上腾起速度，降低起跳高度。`);
        diagnosis.suggestions.push("✅ 改进训练：短助跑刚性踏跳、原地单腿硬支撑跳，体会踏跳瞬间腿部不主动下蹲，保持支撑刚性。");
    }else if(minKneeAngle > 172){
        diagnosis.problems.push(`⚠️ 踏跳支撑几乎无缓冲，腿部刚性极强，但缺少微小弹性形变，发力衔接不够顺滑。`);
        diagnosis.suggestions.push("✅ 改进训练：连续踏跳摸高，保留踏跳极小幅缓冲，感受弹性发力。");
    }else{
        diagnosis.problems.push(`✅ 踏跳膝关节角度(${minKneeAngle.toFixed(1)}°)处于背越式跳高理想区间，支撑刚性控制良好。`);
    }

    // 髋部评估：踏跳伸髋
    if(maxHipAngle <155){
        diagnosis.problems.push(`❌ 踏跳伸髋不足，髋关节打开不够，重心向上推送力量不足，垂直起跳力量损失。`);
        diagnosis.suggestions.push("✅ 改进训练：臀推、跨步跳，强化髋伸肌群，体会踏跳瞬间向前上方顶髋发力。");
    }else{
        diagnosis.problems.push(`✅ 踏跳阶段髋关节伸展充分。`);
    }

    // 腾空躯干/倒肩评估
    if(maxTorsoAngle <70){
        diagnosis.problems.push(`⚠️ 腾空倒肩不足，过杆时背弓打开不够，无法充分利用身体重心，容易碰杆。`);
        diagnosis.suggestions.push("✅ 改进训练：原地背弓挺髋练习、垫上背弓，练习踏跳后快速倒肩、打开躯干形成背弓。");
    }else{
        diagnosis.problems.push(`✅ 腾空阶段躯干倒肩充分，背弓姿态良好。`);
    }
    return diagnosis;
}

// 跨越式跳高诊断
function diagnosisStraddleStyle(jumpDataList, jumpCenterTime){
    const window = jumpDataList.filter(d=>Math.abs(d.time-jumpCenterTime)<0.5);
    let minKneeAngle = null;
    let maxSwingHip = 0;
    let torsoPeak = 0;
    window.forEach(d=>{
        if(d.rightKnee){
            if(minKneeAngle === null || d.rightKnee < minKneeAngle) minKneeAngle = d.rightKnee;
        }
        if(d.swingHipAngle && d.swingHipAngle>maxSwingHip) maxSwingHip = d.swingHip;
        if(d.torsoAngle && d.torsoAngle>torsoPeak) torsoPeak = d.torsoAngle;
    });
    const diagnosis = {
        minKnee: minKneeAngle,
        maxSwingHip:maxSwingHip,
        torsoPeak:torsoPeak,
        problems:[],
        suggestions:[]
    };
    if(minKneeAngle === null){
        diagnosis.problems.push("⚠️ 未能识别踏跳腿膝关节数据，请保证全身入镜，侧面拍摄。");
        diagnosis.suggestions.push("✅ 拍摄：侧面完整记录助跑踏跳、摆动腿上摆、过杆落地。");
    }else if(minKneeAngle <130){
        diagnosis.problems.push(`❌ 踏跳屈膝过多(${minKneeAngle.toFixed(1)}°)，下蹲太深，起跳发力滞后，损失向上速度。`);
        diagnosis.suggestions.push("✅ 训练：短助跑跨越式踏跳，控制踏跳腿屈膝幅度，快速蹬伸。");
    }else if(minKneeAngle>160){
        diagnosis.problems.push(`⚠️ 踏跳屈膝太少，缺少弹性缓冲，蹬伸发力不充分。`);
        diagnosis.suggestions.push("✅ 训练：原地单腿弹性蹬跳，体会适度屈膝缓冲再快速蹬伸。");
    }else{
        diagnosis.problems.push(`✅ 踏跳膝角${minKneeAngle.toFixed(1)}°，跨越式踏跳屈膝缓冲处于理想区间。`);
    }

    // 摆动腿上摆评估（跨越式核心）
    if(maxSwingHip <110){
        diagnosis.problems.push(`❌ 摆动腿上摆高度不足，摆动带动重心提升效果弱，起跳高度受限。`);
        diagnosis.suggestions.push("✅ 训练：原地高摆腿、助跑单腿摆腿摸高，强化摆动腿快速向上带起。");
    }else{
        diagnosis.problems.push(`✅ 摆动腿上摆充分，摆动提重心效果良好。`);
    }

    // 上体前倾评估
    if(torsoPeak <45){
        diagnosis.problems.push(`⚠️ 过杆上体前倾不足，容易坐杆，臀部碰杆。`);
        diagnosis.suggestions.push("✅ 训练：垫上过杆模仿，踏跳后上体主动前倾，使身体越过横杆。");
    }else{
        diagnosis.problems.push(`✅ 过杆上体前倾控制良好，利于身体顺利越过横杆。`);
    }
    return diagnosis;
}

btnAnalyzeAll.onclick = async () => {
    if(!net || !video.src) return alert("请先加载模型并上传视频");
    filterBuffer.length=0;
    updateStatus('分析中...', 'loading');
    btnAnalyzeAll.disabled = true;
    reportEl.innerHTML = '<div class="flex items-center justify-center h-full"><div class="spinner"></div><span class="ml-2">正在分析...</span></div>';
    
    const duration = video.duration;
    const startTime = performance.now();
    const jumpType = jumpTypeSelect.value;
    const coarseStep = parseFloat(sampleStepSelect.value);
    
    const coarseFrames = [];
    for(let t=0; t<=duration; t+=coarseStep) {
        const data = await analyzeFrame(t, false);
        coarseFrames.push(data);
        if(coarseFrames.length % 10 === 0) {
            updateStatus(`粗采样 ${t.toFixed(1)}s/${duration.toFixed(1)}s`, 'loading');
        }
    }
    
    //识别踏跳时刻：膝关节快速变化（踏跳离地瞬间）
    let maxChange = 0, jumpCenter = duration/2;
    for(let i=1; i<coarseFrames.length; i++) {
        const prev = coarseFrames[i-1]?.rightKnee ?? 180;
        const curr = coarseFrames[i]?.rightKnee ?? 180;
        const delta = Math.abs(curr-prev);
        if(delta > maxChange) {
            maxChange = delta;
            jumpCenter = coarseFrames[i].time;
        }
    }
    
    //踏跳窗口精细采样，固定0.033s精细步长
    const fineFrames = [];
    const fineStart = Math.max(0, jumpCenter - 0.5);
    const fineEnd = Math.min(duration, jumpCenter + 0.5);
    for(let t=fineStart; t<=fineEnd; t+=0.033) {
        const data = await analyzeFrame(t, true);
        fineFrames.push(data);
        if(data){
            angleTextEl.innerText = `L膝:${data.leftKnee?.toFixed(1)??'-'}° R膝:${data.rightKnee?.toFixed(1)??'-'}° 躯干:${data.torsoAngle?.toFixed(1)??'-'}°`;
        }
    }
    
    const allFrames = [...coarseFrames];
    fineFrames.forEach(f => {
        if(f && !allFrames.some(c => c && Math.abs(c.time - f.time) < 0.01)) allFrames.push(f);
    });
    allFrames.sort((a,b) => a.time - b.time);
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
    
    let diag;
    let titleName;
    if(jumpType === 'back'){
        diag = diagnosisBackStyle(allFrames, jumpCenter);
        titleName = "背越式跳高专项技术诊断";
    }else{
        diag = diagnosisStraddleStyle(allFrames, jumpCenter);
        titleName = "跨越式跳高专项技术诊断";
    }

    document.getElementById('statFrames').textContent = allFrames.length;
    document.getElementById('statTime').textContent = elapsed;
    document.getElementById('statJump').textContent = jumpCenter.toFixed(2) + 's';
    
    // 跳高诊断模块
    let html = `<div class="diagnosis-block">
        <div class="diagnosis-title">📋 ${titleName}</div>`;
    if(diag.minKnee !== null){
        html += `<div><strong>踏跳窗口最小膝角：</strong>${diag.minKnee.toFixed(1)}°</div>`;
    }else{
        html += `<div><strong>踏跳窗口最小膝角：</strong>识别失败</div>`;
    }
    if(jumpType === 'back'){
        html += `<div><strong>踏跳最大髋角：</strong>${diag.maxHip.toFixed(1)}°</div>
        <div><strong>腾空最大躯干倒肩角：</strong>${diag.maxTorso.toFixed(1)}°</div>`;
    }else{
        html += `<div><strong>摆动腿最大摆髋角：</strong>${diag.maxSwingHip.toFixed(1)}°</div>
        <div><strong>过杆躯干倾角：</strong>${diag.torsoPeak.toFixed(1)}°</div>`;
    }
    html += `<br/>
    <div class="problem-text">【问题判定】</div>`;
    diag.problems.forEach(p=> html += `<div>• ${p}</div>`);
    html += `<br/><div class="suggest-text">【改进训练方案】</div>`;
    diag.suggestions.forEach(s=> html += `<div>• ${s}</div>`);
    html += `</div>`;

    html += `<div class="mb-4 p-3 bg-blue-50 rounded-lg text-sm">
        <strong>分析完成：</strong>${allFrames.length}帧 | 耗时${elapsed}s | 踏跳候选时刻: ${jumpCenter.toFixed(2)}s
    </div>`;
    
    // ===== 改动：表格放到独立滚动容器里，表头固定 =====
    html += `<div class="table-scroll-wrap">
    <table class="w-full text-xs">
    <thead><tr class="bg-slate-200">
        <th class="p-2">时间</th><th class="p-2">左膝</th><th class="p-2">右膝</th><th class="p-2">左髋</th><th class="p-2">右髋</th><th class="p-2">躯干角</th>
    </tr></thead>
    <tbody>`;
    
    allFrames.forEach(d => {
        if(!d) return;
        const isJump = Math.abs(d.time - jumpCenter) < 0.1;
        html += `<tr class="${isJump ? 'highlight-row' : 'hover:bg-slate-50'}">
            <td class="p-2 border-b">${d.time.toFixed(2)}s${isJump ? '🔥踏跳' : ''}</td>
            <td class="p-2 border-b">${d.leftKnee?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.rightKnee?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.leftHip?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.rightHip?.toFixed(1)??'-'}</td>
            <td class="p-2 border-b">${d.torsoAngle?.toFixed(1)??'-'}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    
    reportEl.innerHTML = html;
    updateStatus('分析完成', 'success');
    btnAnalyzeAll.disabled = false;
};

function drawPose(keypoints){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    keypoints.forEach(kp=>{
        if(kp.score > 0.4){
            ctx.beginPath();
            ctx.arc(kp.x, kp.y, 5, 0, 2*Math.PI);
            ctx.fillStyle = "#ff2222";
            ctx.fill();
        }
    });
    const edges = [[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
    ctx.strokeStyle = "#00ff44";
    ctx.lineWidth = 3;
    edges.forEach(([a,b])=>{
        if(keypoints[a].score>0.4 && keypoints[b].score>0.4){
            ctx.beginPath();
            ctx.moveTo(keypoints[a].x, keypoints[a].y);
            ctx.lineTo(keypoints[b].x, keypoints[b].y);
            ctx.stroke();
        }
    });
}
