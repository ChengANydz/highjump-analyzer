<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳高动作技术分析系统 | High-Jump Analyzer</title>
    <!-- 国内镜像CDN -->
    <script src="https://unpkg.cnpmjs.org/tailwindcss@3.3.0/dist/tailwind.min.js"></script>
    <script src="https://unpkg.cnpmjs.org/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
    <script src="https://unpkg.cnpmjs.org/@tensorflow-models/movenet@1.2.1/dist/movenet.min.js"></script>
    <style>
        .video-wrap{position:relative;}
        .pose-canvas{position:absolute;top:0;left:0;pointer-events:none;}
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-slate-800">🏃 跳高动作技术分析系统（逐帧角度追踪版）</h1>
        <p class="text-slate-500 mt-2">上传跳高视频，逐帧追踪人体骨架，自动计算关节角度，分析全程发力特征</p>
    </header>

    <div class="grid lg:grid-cols-2 gap-8">
        <!-- 左侧视频处理区域 -->
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold mb-4">视频输入与姿态可视化</h2>
            <div class="mb-4">
                <label class="block mb-2 font-medium">上传跳高视频（mp4）</label>
                <input type="file" id="videoFile" accept="video/mp4" class="block w-full sm border p-2 rounded">
            </div>
            <div class="video-wrap bg-black rounded overflow-hidden">
                <video id="srcVideo" controls class="w-full"></video>
                <canvas id="poseCanvas" class="pose-canvas w-full"></canvas>
            </div>
            <div class="flex gap-3 mt-4 flex-wrap">
                <button id="btnLoadModel" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">加载MoveNet模型</button>
                <button id="btnAnalyzeAll" disabled class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700 disabled:bg-gray-400">✅ 逐帧全视频分析</button>
            </div>
            <div class="mt-4">状态：<span id="status">等待加载模型</span></div>
            <div class="mt-2">当前帧关节角度：<span id="angleText">-</span></div>
        </div>

        <!-- 右侧分析结果 -->
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-semibold mb-4">📋 全程动作诊断报告</h2>
            <div id="report" class="whitespace-pre-wrap text-slate-700 h-96 overflow-y-auto">
                上传视频、加载AI模型后，点击【逐帧全视频分析】，系统将逐帧识别骨架，计算每一帧髋膝肩肘角度，抓取起跳、腾空、落地阶段发力数据。
            </div>
        </div>
    </div>
</div>

<script>
let model = null;
const video = document.getElementById('srcVideo');
const canvas = document.getElementById('poseCanvas');
const ctx = canvas.getContext('2d');
const btnLoadModel = document.getElementById('btnLoadModel');
const btnAnalyzeAll = document.getElementById('btnAnalyzeAll');
const statusEl = document.getElementById('status');
const reportEl = document.getElementById('report');
const angleTextEl = document.getElementById('angleText');
const fileInput = document.getElementById('videoFile');

// MoveNet 17个关键点索引
const KEYPOINT_NAMES = [
    "鼻子", "左眼", "右眼", "左耳", "右耳",
    "左肩", "右肩", "左肘", "右肘", "左手腕", "右手腕",
    "左髋", "右髋", "左膝", "右膝", "左脚踝", "右脚踝"
];

// 计算三点夹角函数：pointA-vertex-pointB，返回角度（°）
function calcAngle(pA, vertex, pB) {
    const v1x = pA.x - vertex.x;
    const v1y = pA.y - vertex.y;
    const v2x = pB.x - vertex.x;
    const v2y = pB.y - vertex.y;

    const dot = v1x*v2x + v1y*v2y;
    const mag1 = Math.sqrt(v1x*v1x + v1y*v1y);
    const mag2 = Math.sqrt(v2x*v2x + v2y*v2y);
    if(mag1===0 || mag2===0) return null;
    let rad = Math.acos( Math.max(-1, Math.min(1, dot/(mag1*mag2))) );
    return rad * 180 / Math.PI;
}

// 加载MoveNet Thunder高精度模型
btnLoadModel.onclick = async () => {
    try {
        statusEl.textContent = "正在加载MoveNet模型...";
        model = await movenet.load(movenet.ModelType.THUNDER);
        statusEl.textContent = "✅ MoveNet模型加载成功";
        btnAnalyzeAll.disabled = false;
    }catch(e){
        statusEl.textContent = "❌模型加载失败: " + e.message;
        console.error(e);
    }
}

// 上传视频
fileInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    }
}

// 逐帧全视频分析按钮
btnAnalyzeAll.onclick = async () => {
    if(!model){
        alert("请先加载AI模型");
        return;
    }
    if(!video.src){
        alert("请先上传视频");
        return;
    }
    statusEl.textContent = "开始逐帧解析视频...";
    reportEl.textContent = "";
    video.pause();

    const fps = 10; // 采样帧率，数值越大帧越多，速度越慢，跳高10帧每秒足够
    const duration = video.duration;
    const frameInterval = 1 / fps;
    let frameDataList = [];

    // 遍历每一采样帧
    for(let t=0; t <= duration; t += frameInterval){
        video.currentTime = t;
        await new Promise(resolve => video.onseeked = resolve);

        // 预测姿态
        const res = await model.estimateSinglePose(video);
        const kp = res.keypoints;
        drawPose(kp);

        // 计算各关节角度（只在关键点置信>0.4时计算）
        const th = 0.4;
        const angles = {};
        // 左膝：左髋(11) - 左膝(13) - 左脚踝(15)
        if(kp[11].score>th && kp[13].score>th && kp[15].score>th){
            angles.leftKnee = calcAngle(kp[11], kp[13], kp[15]);
        }
        // 右膝：右髋(12)-右膝(14)-右脚踝(16)
        if(kp[12].score>th && kp[14].score>th && kp[16].score>th){
            angles.rightKnee = calcAngle(kp[12], kp[14], kp[16]);
        }
        // 左髋：左肩(5)-左髋(11)-左膝(13)
        if(kp[5].score>th && kp[11].score>th && kp[13].score>th){
            angles.leftHip = calcAngle(kp[5], kp[11], kp[13]);
        }
        // 右髋：右肩(6)-右髋(12)-右膝(14)
        if(kp[6].score>th && kp[12].score>th && kp[14].score>th){
            angles.rightHip = calcAngle(kp[6], kp[12], kp[14]);
        }

        frameDataList.push({time:t.toFixed(2), ...angles});
        angleTextEl.innerText = `左膝:${angles.leftKnee?.toFixed(1)??"-"}° 右膝:${angles.rightKnee?.toFixed(1)??"-"}° 左髋:${angles.leftHip?.toFixed(1)??"-"}° 右髋:${angles.rightHip?.toFixed(1)??"-"}°`;
        statusEl.textContent = `正在解析：${t.toFixed(2)}s / ${duration.toFixed(2)}s`;
        await new Promise(r=>setTimeout(r,10));
    }

    // 汇总报告
    let reportText = `===== 跳高全程逐帧姿态分析报告 =====
总时长：${duration.toFixed(2)} s，采样帧率：${fps} fps，共${frameDataList.length}帧
> 关节说明：膝角越小代表弯曲越大；髋角反映躯干和大腿夹角（背弓腾空时髋角度明显变化）

【全部帧数据】(时间,左膝°,右膝°,左髋°,右髋°)
`;
    frameDataList.forEach(d=>{
        reportText += `${d.time}s | LK:${d.leftKnee?.toFixed(1)??"-"} | RK:${d.rightKnee?.toFixed(1)??"-"} | LH:${d.leftHip?.toFixed(1)??"-"} | RH:${d.rightHip?.toFixed(1)??"-"}\n`;
    })

    // 自动寻找起跳候选帧（膝关节最大伸展，角度变大）
    const validKneeFrames = frameDataList.filter(x=>x.rightKnee);
    if(validKneeFrames.length>0){
        const maxKneeFrame = validKneeFrames.reduce((a,b)=> (a.rightKnee > b.rightKnee)?a:b);
        reportText += `\n🔥【发力关键点推荐】
起跳候选帧：时间${maxKneeFrame.time}s，右膝伸展角度${maxKneeFrame.rightKnee.toFixed(1)}°
>> 此帧膝关节充分蹬伸，大概率是蹬地发力峰值时刻，重点观察！
`
    }
    reportEl.textContent = reportText;
    statusEl.textContent = "✅ 全部帧分析完成！";
}

// 绘制人体关键点+骨架
function drawPose(keypoints){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 画红点
    keypoints.forEach(kp=>{
        if(kp.score > 0.4){
            ctx.beginPath();
            ctx.arc(kp.x, kp.y,5,0,2*Math.PI);
            ctx.fillStyle="#ff2222";
            ctx.fill();
        }
    })
    // 骨架连线
    const edges = [
        [5,6], [5,7], [7,9], [6,8], [8,10],
        [5,11], [6,12], [11,12],
        [11,13], [13,15], [12,14], [14,16]
    ];
    ctx.strokeStyle="#00ff44";
    ctx.lineWidth=3;
    edges.forEach(([a,b])=>{
        if(keypoints[a].score>0.4 && keypoints[b].score>0.4){
            ctx.beginPath();
            ctx.moveTo(keypoints[a].x, keypoints[a].y);
            ctx.lineTo(keypoints[b].x, keypoints[a].y);
            ctx.stroke();
        }
    })
}
</script>
</body>
</html>
